name: Famebit
description: Famebit was an influencer-marketing marketplace, founded in 2013 and headquartered
  in Los Angeles, that connected YouTube, Instagram, and Vine creators with brands
  for sponsored branded-content campaigns. Backed by 500 Startups (500 Global), it
  was acquired by Google in October 2016, rebranded as "FameBit by YouTube," and later
  folded into YouTube BrandConnect. The standalone platform has been shut down and
  famebit.com now redirects to a Google/YouTube Help support page, so there is no
  live public API, developer portal, or documentation to enrich.
